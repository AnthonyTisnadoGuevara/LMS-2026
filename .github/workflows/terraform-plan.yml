
name: Terraform Plan - LMS

run-name: Plan Terraform LMS ejecutado por ${{ github.actor }}

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    name: Validar y planificar Terraform
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: infra/terraform

    env:
      TF_IN_AUTOMATION: "true"
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Configurar credenciales AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Comprobar identidad AWS
        run: aws sts get-caller-identity

      - name: Inicializar backend S3
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"

      - name: Verificar formato Terraform
        run: terraform fmt -check -recursive

      - name: Validar Terraform
        run: terraform validate

      - name: Generar plan Terraform
        run: terraform plan -input=false -no-color
